interface:
  display_name: "蓝白科研 PPT 原生组件版"
  short_description: "按内容选择原生分组组件，拦截纯文字与大数字版式并核对实际导出"
  default_prompt: "请用 $academic-blue-ppt-design 将本次Word制作成可编辑蓝白科研PPT：合并同一页面任务，按内容选择圆角标题、直角蓝白分栏、标签面板与关系组件；稀疏内容先补相关图片、必要时合页，照片与机理图按用途匹配并搭配实线框或虚线框，顶部总述居中、解释段落左对齐且框内靠上，内容组按自然高度排布；禁止纯文字正文、大字号数值突出、缩字和拉伸图片，页头按章与小节编号，目录及切换页显示概括章名并高亮当前章，核对实际PPTX和逐页渲染。"
